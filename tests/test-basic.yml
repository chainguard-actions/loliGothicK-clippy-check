name: Test basic clippy-check usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_HEAD_REF: feature-branch
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust stable toolchain and clippy
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup component add clippy --toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - id: clippy
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-act
          toolchain: stable
          working-directory: ${{ github.workspace }}/pristine/loliGothicK--clippy-check/v0.3.1/tests/fixtures/rust-project

      - name: Assert clippy check ran
        env:
          OUTCOME: ${{ steps.clippy.outcome }}
        run: |
          echo "clippy step outcome: $OUTCOME"
          # The action may fail due to GitHub API rejection with fake token,
          # but it should not crash the runner. Either success or failure is acceptable
          # as long as the step ran (outcome is not 'skipped').
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: clippy step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: clippy step ran with outcome=$OUTCOME"
