name: Test clippy-check with lint controls
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust stable toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Rust and clippy are available
        run: |
          rustc --version
          cargo clippy --version

      - name: Run clippy-check with lint control inputs
        id: clippy
        continue-on-error: true
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          toolchain: stable
          warn: "unused_variables"
          allow: "dead_code"
          name: clippy-lint-controls
          working-directory: pristine/loliGothicK--clippy-check/v0.3.0/tests/fixtures/rust-project

      - name: Assert action ran with lint controls
        run: |
          echo "Clippy action with lint controls completed"
          echo "PASS: action step with warn/allow inputs was reached and executed"
